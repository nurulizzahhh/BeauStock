
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to BeauStock beauty inventory management.">
    <meta name="author" content="BeauStock">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Login | BeauStock</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body class="login-page">

    <main class="login-container">
        <section class="login-brand">
            <img src="images/logo.png" alt="BeauStock logo" class="login-logo">
            <p class="brand-label">BEAUTY INVENTORY MANAGEMENT</p>
            <h1>BeauStock</h1>
            <p class="brand-description">
                Beautifully organised.<br>
                Always in stock.
            </p>
            <div class="brand-decoration">ღ</div>
        </section>

        <section class="login-form-section">
            <div class="login-form">
                <p class="eyebrow">WELCOME BACK</p>
                <h2>Sign in to your account</h2>
                <p class="form-description">
                    Manage your beauty inventory with ease.
                </p>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            value="izzah"
                            autocomplete="username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                value="izzahcomel"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required
                            >

                            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                                👁
                            </button>
                        </div>
                    </div>


                    <p id="loginMessage" class="login-message" role="alert"></p>

                    <button type="submit" class="btn login-button w-100">
                        Sign In
                    </button>
                </form>

                <p class="login-note">
                    User Friendly Inventory Management
                </p>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
